name: ai_chatapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_screenutil_plus: ^1.5.0

  get: ^4.7.3

  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.1

  google_fonts: ^6.2.1

  flutter_spinkit: ^5.2.2

  flutter_dotenv: ^5.1.0

  flutter_gap: ^1.2.0

  uuid: ^4.4.0

  google_generative_ai: ^0.4.3

  speech_to_text: ^7.0.0

  image_picker: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Package for generating Android and iOS launcher icons
  flutter_launcher_icons: ^0.14.3


flutter:

  uses-material-design: true

  assets:

    # Environment file
    - .env

    # All images inside assets/images
    - assets/


# Flutter Launcher Icon configuration
flutter_launcher_icons:

  # Generate Android launcher icon
  android: true

  # Generate iOS launcher icon
  ios: true

  # Image used as the launcher icon
  image_path: "assets/gemini.png"

  # Android adaptive icon settings
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/gemini.png"

  # iOS icon settings
  remove_alpha_ios: true